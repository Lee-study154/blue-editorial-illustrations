<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Blue Editorial Illustrations</title>
  <desc id="desc">深色编辑风格标题视觉。左侧介绍把观点画成动作的克莱因蓝 IP 插画 skill，右侧三张叠放卡片依次表示文稿、物理隐喻与 IP 行动。</desc>
  <defs>
    <pattern id="editorial-grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#F5F3EA" stroke-width="1" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="hero-frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#hero-frame)">
    <rect width="1200" height="420" rx="24" fill="#0A0D12"/>
    <rect width="1200" height="420" rx="24" fill="url(#editorial-grid)"/>
    <path d="M742 0H1200V420H695C789 323 778 136 742 0Z" fill="#002FA7" fill-opacity=".08"/>

    <g id="title-block" transform="translate(68 43)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <text x="0" y="17" fill="#9199A8" font-size="16" font-weight="700" letter-spacing="2.4">EDITORIAL ILLUSTRATION · CODEX SKILL</text>
      <rect x="0" y="34" width="54" height="6" rx="3" fill="#002FA7"/>

      <text x="0" y="126" fill="#F5F3EA" font-size="72" font-weight="760" letter-spacing="0">blue editorial</text>
      <text x="0" y="198" fill="#F5F3EA" font-size="72" font-weight="760" letter-spacing="0">illustrations</text>
      <path d="M2 215L306 212L300 225L18 230L0 225Z" fill="#002FA7"/>

      <text x="0" y="282" fill="#E3E5E8" font-family="'Songti SC', 'Noto Serif CJK SC', 'PingFang SC', serif" font-size="31" font-weight="600" letter-spacing="0">把观点，画成动作。</text>
      <text x="0" y="334" fill="#7F8795" font-size="14" font-weight="700" letter-spacing="1.35">READ THE MANUSCRIPT · BUILD THE METAPHOR · CHECK THE RESULT</text>
    </g>

    <g id="project-process" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <g id="manuscript-card" transform="translate(808 34) rotate(5 146 90)">
        <rect x="8" y="10" width="292" height="180" rx="16" fill="#020306" fill-opacity=".46"/>
        <rect width="292" height="180" rx="16" fill="#F5F3EA"/>
        <rect x="22" y="20" width="54" height="7" rx="3.5" fill="#002FA7"/>
        <text x="22" y="56" fill="#11151B" font-size="17" font-weight="780" letter-spacing=".7">MANUSCRIPT</text>
        <g id="manuscript-pages" transform="translate(22 73)">
          <path d="M0 2H110V83H0Z" fill="#FFFFFF" stroke="#C8CDD5" stroke-width="2"/>
          <path d="M16 21H88M16 38H96M16 55H72M16 69H91" fill="none" stroke="#5F6671" stroke-width="5" stroke-linecap="round"/>
          <path d="M134 10H248V91H134Z" fill="#141922"/>
          <path d="M151 29H227M151 46H235M151 63H211M151 77H226" fill="none" stroke="#AEB4BE" stroke-width="5" stroke-linecap="round"/>
          <path d="M110 42H132M121 32L132 42L121 52" fill="none" stroke="#002FA7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <g id="metaphor-card" transform="translate(704 190) rotate(-6 155 84)">
        <rect x="8" y="10" width="310" height="168" rx="16" fill="#020306" fill-opacity=".46"/>
        <rect width="310" height="168" rx="16" fill="#002FA7"/>
        <text x="22" y="41" fill="#F5F3EA" font-size="16" font-weight="780" letter-spacing=".6">PHYSICAL METAPHOR</text>
        <g id="metaphor-assembly" transform="translate(24 62)">
          <path d="M0 12L29 0L51 24L22 36Z M5 55L36 43L55 71L21 82Z M65 5L94 14L83 43L57 31Z" fill="#F5F3EA" fill-opacity=".9"/>
          <path d="M112 8H169L185 41L169 75H112L96 41Z" fill="#0D121A" stroke="#F5F3EA" stroke-width="3"/>
          <path d="M77 42H105M185 42H214" fill="none" stroke="#F5F3EA" stroke-width="4" stroke-linecap="round"/>
          <path d="M204 31L215 42L204 53" fill="none" stroke="#F5F3EA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="222" y="14" width="64" height="56" fill="#F5F3EA"/>
          <path d="M234 29H274M234 42H274M234 55H265" stroke="#11151B" stroke-width="5" stroke-linecap="round"/>
        </g>
      </g>

      <g id="action-card" transform="translate(920 258) rotate(7 121 64)">
        <rect x="7" y="9" width="242" height="128" rx="15" fill="#020306" fill-opacity=".48"/>
        <rect width="242" height="128" rx="15" fill="#3E454F"/>
        <text x="20" y="39" fill="#F5F3EA" font-size="15" font-weight="780" letter-spacing=".7">IP ACTION</text>
        <g id="abstract-action" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M25 87C57 60 91 61 120 82C145 101 181 97 214 69" stroke="#F5F3EA" stroke-width="4"/>
          <path d="M199 67L216 68L212 85" stroke="#F5F3EA" stroke-width="4"/>
          <path d="M48 68L64 82L51 98M86 66L101 82L89 98" stroke="#002FA7" stroke-width="8"/>
          <circle cx="29" cy="87" r="8" fill="#F5F3EA" stroke="none"/>
          <rect x="183" y="91" width="38" height="12" fill="#002FA7" stroke="none"/>
        </g>
      </g>
    </g>
  </g>
</svg>
